name: checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      verify_registry:
        description: Verify the published 0.1.0 registry package without workspace overrides
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validate:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install stable MoonBit (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install stable MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" >> $env:GITHUB_PATH
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Toolchain
        run: moon version --all
      - name: Dependencies
        run: moon update
      - name: Format
        run: moon fmt --check
      - name: Workflow scripts format
        run: moon fmt --check scripts/demo.mbtx scripts/e2e.mbtx scripts/package_smoke.mbtx scripts/syft_interop.mbtx scripts/real_projects.mbtx scripts/trivy_interop.mbtx scripts/crates_oracle.mbtx scripts/registry_smoke.mbtx scripts/release_check.mbtx
      - name: Interfaces
        run: moon info --target all
      - name: Interface drift
        run: git diff --exit-code
      - name: Strict check
        run: moon check --target all --deny-warn
      - name: Wasm tests
        run: moon test --target wasm --deny-warn
      - name: Wasm-GC tests
        run: moon test --target wasm-gc --deny-warn
      - name: JavaScript tests
        run: moon test --target js --deny-warn
      - name: Native tests
        run: moon test --target native --deny-warn
      - name: End-to-end Wasm
        run: moon run scripts/e2e.mbtx wasm
      - name: End-to-end native
        run: moon run scripts/e2e.mbtx native
      - name: Reproducible review demo
        run: moon run scripts/demo.mbtx
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source archive adoption
        run: moon run scripts/package_smoke.mbtx
      - name: Standalone consumer from release archive
        run: moon run scripts/registry_smoke.mbtx --archive
      - name: Read-only release candidate
        run: moon run scripts/release_check.mbtx
      - name: Published registry adoption
        if: github.event_name == 'workflow_dispatch' && inputs.verify_registry
        run: moon run scripts/registry_smoke.mbtx --registry
      - name: Independent SBOM producer
        if: runner.os == 'Linux'
        run: moon run scripts/syft_interop.mbtx --fetch-linux
      - name: Public project review across Syft and Trivy
        if: runner.os == 'Linux'
        run: moon run scripts/trivy_interop.mbtx --fetch-linux --fresh-syft
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: trivy-review-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            _build/yuejian-trivy-*/
            !_build/yuejian-trivy-*/trivy
            !_build/yuejian-trivy-*/trivy.tar.gz
            !_build/yuejian-trivy-*/cache/**
      - name: Independent report validators
        if: runner.os == 'Linux'
        run: python -m pip install --disable-pip-version-check check-jsonschema==0.39.0 commonmark==0.9.1 semver==3.0.4
      - name: Independent crates.io ordering oracle
        if: runner.os == 'Linux'
        run: moon run scripts/crates_oracle.mbtx
      - name: Official SARIF schema
        if: runner.os == 'Linux'
        run: moon run scripts/sarif_schema.mbtx
      - name: Markdown rendering
        if: runner.os == 'Linux'
        run: moon run scripts/review_render.mbtx
      - name: Downstream consumer
        run: moon -C examples/consumer run . --target wasm --deny-warn
